<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi there👋</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="assets/icons/letter-p.svg" />
  </head>
  <body>
    <div id="bg"></div>
    <div class="container" id="container">
      <div class="image_container">
        <img src="assets/cappy.jpg" class="mainimage" />
      </div>
      <div class="tag">@pratyush</div>
    </div>
    <div class="links">
      <ul>
        <li>
          <a href="" target="_blank">
            <img src="assets/icons/home.svg" alt="homepage" width="30" />
            Official website
          </a>
        </li>

        <li>
          <a href="https://www.youtube.com/@pratyush3001" target="_blank">
            <img src="assets/icons/yt.svg" alt="youtube" width="30px" />
            Youtube
          </a>
        </li>
        <li>
          <a href="https://github.com/Pratyushcodes0000" target="_blank">
            <img src="assets/icons/github.svg" alt="github" width="30px" />
            Github
          </a>
        </li>
        <li>
          <a href="https://x.com/Pratyush18227" target="_blank">
            <img src="assets/icons/x.svg" alt="x" width="30px" />
            Twitter
          </a>
        </li>
      </ul>
    </div>
    <script type="module" src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
    <script>
      if (window.VANTA) {
        VANTA.WAVES({
          el: "#bg",
          mouseControls: true,
          touchControls: true,
          gyroControls: true,
          minHeight: 200.0,
          minWidth: 200.0,
          scale: 1.0,
          scaleMobile: 1.0,
          waveHeight: 23.0,
          waveSpeed: 1.1,
          zoom: 0.93,
        });
      }

      const container = document.querySelector(".container");
      const links = document.querySelector(".links");

      setTimeout(() => {
        container?.classList.add("is-visible");
        links?.classList.add("is-visible");
      }, 1000);
    </script>
  </body>
</html>
